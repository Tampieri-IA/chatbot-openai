spring:
  application:
    name: chatbot-openai
  profiles:
    active: mock
  datasource:
    url: jdbc:h2:mem:chatbotdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
  h2:
    console:
      enabled: true
      path: /h2-console

server:
  port: 8080

openai:
  api:
    key: ${OPENAI_API_KEY}
    model: gpt-4o-mini

springdoc:
  swagger-ui:
    path: /swagger-ui.html

chat:
  historic:
    max: 20